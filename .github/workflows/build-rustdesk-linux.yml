name: Build RustDesk Linux

on:
  workflow_dispatch:
    inputs:
      rustdesk_ref:
        description: RustDesk branch, tag, or commit
        required: true
        default: master
      upload_release:
        description: Upload to GitHub Release
        required: true
        default: "false"
      embed_selfhost_config:
        description: Embed self-hosted server defaults into the compiled client when secrets are configured
        required: true
        default: "true"
  push:
    branches:
      - main
      - master

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_DEFAULT_TRIPLET: x64-linux
  VCPKG_DEFAULT_HOST_TRIPLET: x64-linux

jobs:
  resolve-rustdesk-ref:
    runs-on: ubuntu-22.04
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      artifact_suffix: ${{ steps.ref.outputs.artifact_suffix }}

    steps:
      - name: Resolve RustDesk ref
        id: ref
        shell: bash
        run: |
          ref="${{ github.event.inputs.rustdesk_ref }}"
          ref="${ref:-master}"
          artifact_suffix="$(printf '%s' "$ref" | tr '/\:*?"<>|' '-')"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "artifact_suffix=$artifact_suffix" >> "$GITHUB_OUTPUT"

  generate-bridge:
    needs: resolve-rustdesk-ref
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout RustDesk source
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ needs.resolve-rustdesk-ref.outputs.ref }}
          submodules: recursive

      - name: Install bridge prerequisites
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            gcc \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - name: Setup bridge Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: "3.22.3"

      - name: Generate Flutter Rust Bridge files
        shell: bash
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          sed -i 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter
          flutter pub get
          popd
          "${HOME}/.cargo/bin/flutter_rust_bridge_codegen" \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Verify generated bridge files
        shell: bash
        run: |
          for file in \
            src/bridge_generated.rs \
            src/bridge_generated.io.rs \
            flutter/lib/generated_bridge.dart \
            flutter/lib/generated_bridge.freezed.dart; do
            test -s "$file" || { echo "::error::Missing generated bridge file: $file"; exit 1; }
          done

      - name: Upload generated bridge files
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-linux-bridge-${{ needs.resolve-rustdesk-ref.outputs.artifact_suffix }}
          path: |
            src/bridge_generated.rs
            src/bridge_generated.io.rs
            flutter/lib/generated_bridge.dart
            flutter/lib/generated_bridge.freezed.dart
            flutter/macos/Runner/bridge_generated.h
            flutter/ios/Runner/bridge_generated.h

  build-linux:
    needs:
      - resolve-rustdesk-ref
      - generate-bridge
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Free build space
        shell: bash
        run: |
          sudo rm -rf /opt/ghc /usr/local/lib/android /usr/share/dotnet
          df -h

      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Checkout RustDesk source
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ needs.resolve-rustdesk-ref.outputs.ref }}
          path: rustdesk
          submodules: recursive

      - name: Restore generated bridge files
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-linux-bridge-${{ needs.resolve-rustdesk-ref.outputs.artifact_suffix }}
          path: rustdesk

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            curl \
            gcc \
            g++ \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libc6-dev \
            libclang-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            libpulse-dev \
            libssl-dev \
            libunwind-dev \
            libva-dev \
            libwayland-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            libxfixes-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            python3-pip \
            wayland-protocols

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rustdesk/target
          key: Linux-cargo-${{ env.RUST_VERSION }}-${{ hashFiles('rustdesk/**/Cargo.lock') }}
          restore-keys: |
            Linux-cargo-${{ env.RUST_VERSION }}-
            Linux-cargo-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$GITHUB_WORKSPACE/vcpkg"
          git -C "$GITHUB_WORKSPACE/vcpkg" fetch --depth 1 origin "$VCPKG_COMMIT_ID"
          git -C "$GITHUB_WORKSPACE/vcpkg" reset --hard "$VCPKG_COMMIT_ID"
          "$GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"

      - name: Install vcpkg dependencies
        shell: bash
        working-directory: rustdesk
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --triplet "$VCPKG_DEFAULT_TRIPLET" \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Apply required Flutter patch
        shell: bash
        run: |
          patch="$GITHUB_WORKSPACE/rustdesk/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          if [[ -f "$patch" ]]; then
            flutter_root="$(dirname "$(dirname "$(command -v flutter)")")"
            git -C "$flutter_root" apply --check "$patch"
            git -C "$flutter_root" apply "$patch"
          else
            echo "::warning::RustDesk ref does not provide the Flutter 3.24.5 patch; continuing without it."
          fi

      - name: Apply embedded self-host configuration
        if: ${{ github.event.inputs.embed_selfhost_config != 'false' }}
        shell: bash
        env:
          RUSTDESK_HOST: ${{ secrets.RUSTDESK_HOST }}
          RUSTDESK_KEY: ${{ secrets.RUSTDESK_KEY }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/apply-embedded-server-config.sh" "$GITHUB_WORKSPACE/rustdesk"

      - name: Build Linux Debian package
        shell: bash
        working-directory: rustdesk
        env:
          RUSTDESK_HOST: ${{ secrets.RUSTDESK_HOST }}
          EMBED_SELFHOST_CONFIG: ${{ github.event.inputs.embed_selfhost_config }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/build-linux.sh"

      - name: Collect Debian package
        shell: bash
        run: |
          mkdir -p dist
          shopt -s nullglob
          packages=(rustdesk/rustdesk-*.deb)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected exactly one RustDesk Debian package, found ${#packages[@]}." >&2
            exit 1
          fi
          cp "${packages[0]}" dist/

      - name: Upload Debian package for AppImage build
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-linux-x64-deb-${{ needs.resolve-rustdesk-ref.outputs.artifact_suffix }}
          path: dist/*.deb

  build-appimage:
    needs:
      - resolve-rustdesk-ref
      - build-linux
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout RustDesk source
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ needs.resolve-rustdesk-ref.outputs.ref }}
          path: rustdesk
          submodules: recursive

      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-linux-x64-deb-${{ needs.resolve-rustdesk-ref.outputs.artifact_suffix }}
          path: dist

      - name: Build AppImage
        shell: bash
        working-directory: rustdesk
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libarchive-tools libfuse2
          python3 -m pip install --user "setuptools_scm<10"
          python3 -m pip install --user git+https://github.com/rustdesk-org/appimage-builder.git
          export PATH="$HOME/.local/bin:$PATH"
          shopt -s nullglob
          packages=("$GITHUB_WORKSPACE"/dist/*.deb)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected exactly one Debian package for AppImage, found ${#packages[@]}." >&2
            exit 1
          fi
          cp "${packages[0]}" appimage/rustdesk.deb
          pushd appimage
          bash "$GITHUB_WORKSPACE/scripts/prepare-appimage-recipe.sh" ./AppImageBuilder-x86_64.yml
          ./build-apprun.sh x86_64
          appimage-builder --skip-tests --recipe ./AppImageBuilder-x86_64.yml
          appimages=(rustdesk-*.AppImage)
          if [[ ${#appimages[@]} -ne 1 ]]; then
            echo "Expected exactly one AppImage, found ${#appimages[@]}." >&2
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "${appimages[0]}" "$GITHUB_WORKSPACE/dist/"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-linux-x64-${{ needs.resolve-rustdesk-ref.outputs.artifact_suffix }}
          path: |
            dist/*.deb
            dist/*.AppImage

      - name: Create Release
        if: ${{ github.event.inputs.upload_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rustdesk-linux-x64-${{ needs.resolve-rustdesk-ref.outputs.ref }}
          name: RustDesk Linux x64 ${{ needs.resolve-rustdesk-ref.outputs.ref }}
          files: |
            dist/*.deb
            dist/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
