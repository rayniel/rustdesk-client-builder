name: Build RustDesk Windows

on:
  workflow_dispatch:
    inputs:
      rustdesk_ref:
        description: RustDesk branch, tag, or commit
        required: true
        default: master
      upload_release:
        description: Upload to GitHub Release
        required: true
        default: "false"
      embed_selfhost_config:
        description: Embed self-hosted server defaults into the compiled client when secrets are configured
        required: true
        default: "true"
  push:
    branches:
      - main
      - master

env:
  CARGO_TERM_COLOR: 'always'
  VCPKG_ROOT: 'C:\vcpkg'
  RUST_VERSION: '1.75'
  FLUTTER_VERSION: '3.24.5'
  LLVM_VERSION: '15.0.6'
  NASM_VERSION: '2.16.03'
  VCPKG_COMMIT_ID: '9e593bb18ea69cc5095e012465dcd675a822ed0d'
  VCPKG_DEFAULT_TRIPLET: 'x64-windows-static'
  VCPKG_DEFAULT_HOST_TRIPLET: 'x64-windows-static'

jobs:
  resolve-rustdesk-ref:
    runs-on: ubuntu-22.04
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      artifact_suffix: ${{ steps.ref.outputs.artifact_suffix }}

    steps:
      - name: Resolve RustDesk ref
        id: ref
        shell: bash
        run: |
          ref="${{ github.event.inputs.rustdesk_ref }}"
          ref="${ref:-master}"
          artifact_suffix="$(printf '%s' "$ref" | tr '/\:*?"<>|' '-')"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "artifact_suffix=$artifact_suffix" >> "$GITHUB_OUTPUT"

  generate-bridge:
    needs: resolve-rustdesk-ref
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout RustDesk source
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ needs.resolve-rustdesk-ref.outputs.ref }}
          submodules: recursive

      - name: Install bridge prerequisites
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            gcc \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - name: Verify Rust formatter
        shell: bash
        run: |
          rustup component add rustfmt --toolchain ${{ env.RUST_VERSION }}-x86_64-unknown-linux-gnu
          rustfmt --version

      - name: Setup bridge Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: '3.22.3'

      - name: Generate Flutter Rust Bridge files
        shell: bash
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          sed -i 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter
          flutter pub get
          popd
          "${HOME}/.cargo/bin/flutter_rust_bridge_codegen" \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Verify generated bridge files
        shell: bash
        run: |
          for file in \
            src/bridge_generated.rs \
            src/bridge_generated.io.rs \
            flutter/lib/generated_bridge.dart \
            flutter/lib/generated_bridge.freezed.dart; do
            test -s "$file" || { echo "::error::Missing generated bridge file: $file"; exit 1; }
          done

      - name: Upload generated bridge files
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-bridge-${{ needs.resolve-rustdesk-ref.outputs.artifact_suffix }}
          path: |
            src/bridge_generated.rs
            src/bridge_generated.io.rs
            flutter/lib/generated_bridge.dart
            flutter/lib/generated_bridge.freezed.dart
            flutter/macos/Runner/bridge_generated.h
            flutter/ios/Runner/bridge_generated.h

  build-windows:
    needs:
      - resolve-rustdesk-ref
      - generate-bridge
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Checkout RustDesk source
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ needs.resolve-rustdesk-ref.outputs.ref }}
          path: rustdesk
          submodules: recursive

      - name: Restore generated bridge files
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-bridge-${{ needs.resolve-rustdesk-ref.outputs.artifact_suffix }}
          path: rustdesk

      - name: Verify generated bridge files
        shell: pwsh
        working-directory: rustdesk
        run: |
          $requiredFiles = @(
            'src\bridge_generated.rs',
            'src\bridge_generated.io.rs',
            'flutter\lib\generated_bridge.dart',
            'flutter\lib\generated_bridge.freezed.dart'
          )
          $missingFiles = $requiredFiles | Where-Object { -not (Test-Path $_) }
          if ($missingFiles) {
            throw "Missing generated Flutter Rust Bridge files: $($missingFiles -join ', ')"
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            rustdesk\target
          key: ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-${{ hashFiles('rustdesk/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-
            ${{ runner.os }}-cargo-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Set LIBCLANG_PATH
        shell: pwsh
        run: |
          "LIBCLANG_PATH=$env:LLVM_PATH\bin" >> $env:GITHUB_ENV
          "PATH=$env:LLVM_PATH\bin;$env:PATH" >> $env:GITHUB_ENV

      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm --version $env:NASM_VERSION -y --no-progress

          $nasmCommand = Get-Command nasm -ErrorAction SilentlyContinue
          if (-not $nasmCommand) {
            $candidatePaths = @(
              (Join-Path $env:ProgramFiles 'NASM'),
              (Join-Path ${env:ProgramFiles(x86)} 'NASM'),
              (Join-Path $env:ChocolateyInstall 'bin')
            ) | Where-Object { $_ -and (Test-Path $_) }

            foreach ($candidate in $candidatePaths) {
              $env:PATH = "$candidate;$env:PATH"
              $nasmCommand = Get-Command nasm -ErrorAction SilentlyContinue
              if ($nasmCommand) {
                break
              }
            }
          }

          if (-not $nasmCommand) {
            throw 'NASM was installed but nasm.exe was not found in PATH.'
          }

          $nasmDir = Split-Path -Parent $nasmCommand.Source
          $env:PATH = "$nasmDir;$env:PATH"
          $nasmDir >> $env:GITHUB_PATH
          "NASM_EXE=$($nasmCommand.Source)" >> $env:GITHUB_ENV
          nasm -v

      - name: Install Strawberry Perl
        shell: pwsh
        run: |
          choco install strawberryperl -y --no-progress

      - name: Setup vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path $env:VCPKG_ROOT)) {
            git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          }
          Push-Location $env:VCPKG_ROOT
          git fetch --depth 1 origin $env:VCPKG_COMMIT_ID
          git reset --hard $env:VCPKG_COMMIT_ID
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          Pop-Location

      - name: Show vcpkg toolchain info
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" version
          Write-Host "Pinned vcpkg commit: $env:VCPKG_COMMIT_ID"
          nasm -v

      - name: Install vcpkg dependencies
        shell: pwsh
        working-directory: rustdesk
        run: |
          $vcpkg = "$env:VCPKG_ROOT\vcpkg.exe"
          & $vcpkg install --triplet $env:VCPKG_DEFAULT_TRIPLET --x-install-root="$env:VCPKG_ROOT\installed"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "==> vcpkg install failed; dumping recent build logs"
            Get-ChildItem "$env:VCPKG_ROOT\buildtrees" -Recurse -Filter *.log -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 10 |
              ForEach-Object {
                Write-Host "----- $($_.FullName) -----"
                Get-Content $_.FullName -Tail 80 -ErrorAction SilentlyContinue
              }
            exit $LASTEXITCODE
          }

      - name: Flutter doctor
        shell: pwsh
        run: |
          flutter --version
          flutter doctor -v

      - name: Replace engine with RustDesk custom Flutter engine
        shell: pwsh
        run: |
          flutter precache --windows
          $flutterRoot = $env:FLUTTER_ROOT
          if ([string]::IsNullOrWhiteSpace($flutterRoot)) {
            $flutterCommand = Get-Command flutter -ErrorAction Stop
            $flutterRoot = Split-Path -Parent $flutterCommand.Source
          }
          $engineRoot = Join-Path $flutterRoot 'bin\cache\artifacts\engine\windows-x64-release'
          New-Item -ItemType Directory -Force -Path $engineRoot | Out-Null
          if (-not (Test-Path $engineRoot -PathType Container)) {
            throw "Flutter Windows engine directory was not created: $engineRoot"
          }
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          Copy-Item windows-x64-release\* $engineRoot -Recurse -Force

      - name: Apply required Flutter patch
        shell: pwsh
        run: |
          $patch = Join-Path $env:GITHUB_WORKSPACE 'rustdesk\.github\patches\flutter_3.24.4_dropdown_menu_enableFilter.diff'
          if (Test-Path $patch) {
            $flutterRoot = $env:FLUTTER_ROOT
            if ([string]::IsNullOrWhiteSpace($flutterRoot)) {
              $flutterCommand = Get-Command flutter -ErrorAction Stop
              $flutterRoot = Split-Path -Parent $flutterCommand.Source
            }
            git -C $flutterRoot apply --check $patch
            git -C $flutterRoot apply $patch
          } else {
            Write-Warning "RustDesk ref does not provide the Flutter 3.24.5 patch; continuing without it."
          }

      - name: Show tool versions
        shell: pwsh
        run: |
          rustc -Vv
          cargo -V
          python --version
          git --version
          clang --version
          nasm -v

      - name: Apply embedded self-host configuration
        if: ${{ github.event.inputs.embed_selfhost_config != 'false' }}
        shell: pwsh
        env:
          RUSTDESK_HOST: ${{ secrets.RUSTDESK_HOST }}
          RUSTDESK_KEY: ${{ secrets.RUSTDESK_KEY }}
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\apply-embedded-server-config.ps1')

      - name: Run build script
        shell: pwsh
        working-directory: rustdesk
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
          LIBCLANG_PATH: ${{ env.LIBCLANG_PATH }}
          RUSTDESK_HOST: ${{ secrets.RUSTDESK_HOST }}
          EMBED_SELFHOST_CONFIG: ${{ github.event.inputs.embed_selfhost_config }}
        run: |
          ..\scripts\build.ps1

      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $installers = @(Get-ChildItem -Path rustdesk -Filter 'rustdesk-*-install.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one RustDesk installer, found $($installers.Count)."
          }
          Copy-Item -Path $installers[0].FullName -Destination 'dist\' -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-x64-${{ needs.resolve-rustdesk-ref.outputs.artifact_suffix }}
          path: dist\*.exe

      - name: Create Release
        if: ${{ github.event.inputs.upload_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rustdesk-windows-x64-${{ needs.resolve-rustdesk-ref.outputs.ref }}
          name: RustDesk Windows x64 ${{ needs.resolve-rustdesk-ref.outputs.ref }}
          files: dist\*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}